# macOS Default universal, preserving the committed Windows payload.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: Continuity Camera
  MACOS_DEPLOYMENT_TARGET: '11.0'
  BASE_DIR: test

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate source and publication absence before native work
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check clean selected checkout before native work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py preflight --sha "$GITHUB_SHA"
      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash .github/scripts/native.sh import-certificate
      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: bash .github/scripts/native.sh store-credentials
      - name: build macOS plugin (universal)
        run: bash .github/scripts/native.sh build
      - name: verify universal binary
        run: |
          bash .github/scripts/native.sh verify
          python3 .github/scripts/source_version.py --verify-bundle "$BASE_DIR/Plugins/$PRODUCT_NAME.bundle"
      - name: codesign
        run: bash .github/scripts/native.sh sign
      - name: package, notarize & staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/native.sh package
      - name: Revalidate retained outputs and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" "Continuity Camera-${VERSION}.zip" "Continuity Camera-${VERSION}.dmg"
